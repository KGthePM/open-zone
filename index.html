<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPEN REDZONE</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13"></script>
<style>
  :root {
    --bg: #0a0a0a; --panel: #141414; --edge: #262626;
    --red: #e50539; --amber: #ffb800; --green: #22c55e;
    --text: #ededed; --dim: #8a8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 2px solid var(--red); flex-shrink: 0;
  }
  header h1 { font-size: 20px; letter-spacing: 3px; font-weight: 900; }
  header h1 span { color: var(--red); }
  #status { font-size: 12px; color: var(--dim); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #autopilot {
    display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    font-size: 12px; font-weight: 700; padding: 6px 12px; border: 1px solid var(--edge); border-radius: 20px;
  }
  #autopilot.on { border-color: var(--green); color: var(--green); }
  #autopilot.off { border-color: var(--amber); color: var(--amber); }
  #proxytog {
    font-size: 11px; font-weight: 700; letter-spacing: 1px; padding: 6px 10px;
    border: 1px solid var(--edge); border-radius: 20px; color: var(--dim); cursor: pointer; user-select: none;
  }
  #proxytog.on { border-color: var(--green); color: var(--green); }
  #autopilot .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity: 0.3; } }

  main { flex: 1; display: flex; min-height: 0; }

  #stage-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #stage { flex: 1; position: relative; background: #000; min-height: 0; }
  #stage video, #stage iframe { width: 100%; height: 100%; object-fit: contain; position: absolute; inset: 0; border: 0; }
  #stage .label {
    position: absolute; top: 0; left: 0; background: var(--red); color: #fff;
    font-weight: 900; font-size: 14px; letter-spacing: 1px; padding: 6px 14px; z-index: 2;
  }
  #stage .razor { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--red); z-index: 3; animation: razor 2s linear infinite; display: none; }
  @keyframes razor { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  #stage .razor.live { display: block; }

  #ticker { height: 30px; background: var(--panel); border-top: 1px solid var(--edge); display: flex; align-items: center; overflow: hidden; flex-shrink: 0; }
  #ticker .items { display: flex; gap: 40px; white-space: nowrap; animation: scroll 30s linear infinite; font-size: 12px; color: var(--dim); padding-left: 100%; }
  #ticker .items b { color: var(--text); }
  #ticker .rz { color: var(--red); font-weight: 900; }
  @keyframes scroll { 100% { transform: translateX(-100%); } }

  #sidebar { width: 320px; border-left: 1px solid var(--edge); display: flex; flex-direction: column; flex-shrink: 0; background: var(--panel); }
  #boxes { flex: 1; overflow-y: auto; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
  .box {
    position: relative; aspect-ratio: 16/9; background: #000; border: 2px solid var(--edge);
    border-radius: 6px; overflow: hidden; cursor: pointer; transition: border-color .15s;
  }
  .box:hover { border-color: var(--dim); }
  .box.main { border-color: var(--red); }
  .box.hot { border-color: var(--amber); box-shadow: 0 0 12px rgba(255,184,0,.4); }
  .box video, .box iframe { width: 100%; height: 100%; object-fit: cover; border: 0; pointer-events: none; }
  .box .tag {
    position: absolute; bottom: 0; left: 0; right: 0; font-size: 11px; padding: 3px 8px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); display: flex; justify-content: space-between;
  }
  .box .tag .num { color: var(--dim); font-weight: 700; }
  .box .tag .rzflag { color: var(--red); font-weight: 900; }
  .box .del {
    position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; line-height: 18px; text-align: center;
    background: rgba(0,0,0,.6); color: var(--dim); border-radius: 4px; font-size: 12px; z-index: 2;
  }
  .box .del:hover { color: #fff; background: var(--red); }

  #addform { padding: 10px; border-top: 1px solid var(--edge); display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  #addform input, #addform select {
    background: var(--bg); border: 1px solid var(--edge); color: var(--text);
    padding: 8px; border-radius: 4px; font-size: 13px; width: 100%;
  }
  #addform button {
    background: var(--red); color: #fff; border: 0; padding: 9px; border-radius: 4px;
    font-weight: 700; font-size: 13px; cursor: pointer; letter-spacing: 1px;
  }
  #addform button:hover { filter: brightness(1.15); }
  .hint { font-size: 10px; color: var(--dim); }
  #demo-btn { background: transparent; border: 1px solid var(--edge); color: var(--dim) !important; }
  #pack-btn { background: transparent; border: 1px solid var(--red); color: var(--red) !important; }

  #pack-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.8); z-index: 50;
    display: none; align-items: center; justify-content: center;
  }
  #pack-modal.open { display: flex; }
  #pack-panel {
    width: 520px; max-width: 92vw; max-height: 80vh; background: var(--panel);
    border: 1px solid var(--edge); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden;
  }
  #pack-panel .head { padding: 12px 14px; border-bottom: 1px solid var(--edge); display: flex; gap: 8px; align-items: center; }
  #pack-panel .head b { letter-spacing: 1px; font-size: 13px; flex: 1; }
  #pack-panel input {
    background: var(--bg); border: 1px solid var(--edge); color: var(--text);
    padding: 7px 9px; border-radius: 4px; font-size: 12px; width: 100%;
  }
  #pack-url-row { padding: 10px 14px; border-bottom: 1px solid var(--edge); display: flex; gap: 6px; }
  #pack-url-row input { flex: 1; }
  #pack-url-row button, #pack-panel .head button {
    background: var(--red); color: #fff; border: 0; padding: 7px 12px; border-radius: 4px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap;
  }
  #pack-list { overflow-y: auto; flex: 1; }
  #pack-list .chan {
    padding: 8px 14px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; gap: 10px;
    border-bottom: 1px solid #1d1d1d;
  }
  #pack-list .chan:hover { background: #1e1e1e; color: var(--red); }
  #pack-list .chan .u { color: var(--dim); font-size: 10px; max-width: 45%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #pack-list .chan.added { color: var(--green); }
</style>
</head>
<body>

<header>
  <h1>OPEN<span>REDZONE</span></h1>
  <div id="status">booting…</div>
  <div id="autopilot" class="on"><span class="dot"></span><span id="ap-text">AUTOPILOT</span></div>
  <div id="proxytog" class="on" title="route HLS through local proxy (fixes CORS-blocked channels)">PROXY ON</div>
</header>

<div id="pack-modal">
  <div id="pack-panel">
    <div class="head"><b>📦 SOURCE PACKS</b><button id="pack-close">✕</button></div>
    <div id="pack-url-row">
      <input id="pack-url" placeholder="Paste any .m3u / .m3u8 playlist URL" value="https://iptv-org.github.io/iptv/categories/sports.m3u">
      <button id="pack-load">LOAD</button>
    </div>
    <div style="padding:10px 14px;border-bottom:1px solid var(--edge)"><input id="pack-search" placeholder="search channels… (e.g. fight, nfl, red bull)"></div>
    <div id="pack-list"><div style="padding:14px;color:var(--dim);font-size:12px">Load a pack to browse channels. Tap a channel to add it as a box.</div></div>
  </div>
</div>

<main>
  <div id="stage-wrap">
    <div id="stage">
      <div class="razor" id="razor"></div>
      <div class="label" id="stage-label">NO SIGNAL</div>
    </div>
    <div id="ticker"><div class="items" id="ticker-items"><span>waiting for scores…</span></div></div>
  </div>

  <div id="sidebar">
    <div id="boxes"></div>
    <form id="addform">
      <input id="f-name" placeholder="Box name (e.g. PHI vs DAL)" required>
      <input id="f-url" placeholder="Stream URL (.m3u8 / YouTube / any embed)" required>
      <input id="f-team" placeholder="NFL team abbrev to track (e.g. PHI) — optional">
      <button type="submit">+ ADD BOX</button>
      <button type="button" id="pack-btn">📦 SOURCE PACKS</button>
      <button type="button" id="demo-btn">load demo streams</button>
      <div class="hint">keys 1–9 swap · click a box = manual (pauses autopilot 2 min) · m3u8 uses hls.js</div>
    </form>
  </div>
</main>

<script>
// ---------- state ----------
let boxes = JSON.parse(localStorage.getItem('orz_boxes') || '[]');
let mainIdx = -1;
let autopilot = true;
let manualUntil = 0;          // timestamp until which manual choice wins
let espnGames = [];           // live games from ESPN
let pollTimer = null;

const $ = id => document.getElementById(id);

// ---------- proxy (CORS unlock) ----------
let useProxy = true;
function mediaUrl(url) {
  if (!useProxy) return url;
  if (/\.m3u8(\?|$)/i.test(url)) return '/proxy?url=' + encodeURIComponent(url);
  return url;
}
$('proxytog').addEventListener('click', () => {
  useProxy = !useProxy;
  $('proxytog').className = useProxy ? 'on' : 'off';
  $('proxytog').textContent = useProxy ? 'PROXY ON' : 'PROXY OFF';
  render();
});

// ---------- stream attach ----------
function attachMedia(el, url) {
  url = mediaUrl(url);
  if (/\.m3u8(\?|$)/i.test(url) || url.startsWith('/proxy')) {
    const video = document.createElement('video');
    video.muted = true; video.autoplay = true; video.playsInline = true;
    el.appendChild(video);
    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ liveDurationInfinity: true });
      hls.loadSource(url); hls.attachMedia(video);
      video._hls = hls;
    } else {
      video.src = url; // Safari native
    }
  } else {
    const ifr = document.createElement('iframe');
    ifr.allow = 'autoplay; encrypted-media; picture-in-picture';
    ifr.src = youtubeEmbed(url);
    el.appendChild(ifr);
  }
}
function youtubeEmbed(url) {
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/)|youtu\.be\/)([\w-]{6,})/);
  return m ? `https://www.youtube.com/embed/${m[1]}?autoplay=1&mute=1` : url;
}
function destroyMedia(el) {
  el.querySelectorAll('video,iframe').forEach(n => { if (n._hls) n._hls.destroy(); n.remove(); });
}

// ---------- render ----------
let boxEls = [];       // persistent DOM per box so streams aren't killed on re-render
let stageUrl = null;   // current stage media url
function render() {
  const grid = $('boxes');
  // remove stale els
  while (boxEls.length > boxes.length) { const el = boxEls.pop(); if (el._hls_vid) el._hls_vid._hls && el._hls_vid._hls.destroy(); el.remove(); }
  boxes.forEach((b, i) => {
    let div = boxEls[i];
    if (!div || div.dataset.url !== b.url) {
      if (div) { div.querySelectorAll('video,iframe').forEach(n => { if (n._hls) n._hls.destroy(); n.remove(); }); }
      else {
        div = document.createElement('div');
        div.dataset.i = i;
        div.innerHTML = `<span class="del" data-del="${i}">✕</span><div class="tag"><span class="num"></span><span class="meta"></span></div>`;
        boxEls[i] = div; grid.appendChild(div);
      }
      div.dataset.url = b.url;
      attachMedia(div, b.url);
      div._hls_vid = div.querySelector('video');
    }
    div.className = 'box' + (i === mainIdx ? ' main' : '') + (b.hot ? ' hot' : '');
    div.querySelector('.num').textContent = `${i + 1} · ${b.name}`;
    const rz = b.hot && b.sitLine ? ` <span class="rzflag">● ${b.sitLine}</span>` : '';
    div.querySelector('.meta').innerHTML = `${b.score || ''}${rz}`;
  });
  // keep delete handlers aligned after removals
  boxEls.forEach((el, i) => el.querySelector('.del').dataset.del = i);
  localStorage.setItem('orz_boxes', JSON.stringify(boxes));
  paintStage();
}
function paintStage() {
  const stage = $('stage');
  const b = boxes[mainIdx];
  const want = b ? mediaUrl(b.url) : null;
  if (want !== stageUrl) {
    stageUrl = want;
    stage.querySelectorAll('video,iframe').forEach(n => { if (n._hls) n._hls.destroy(); n.remove(); });
    if (b) attachMedia(stage, b.url);
    $('stage-label').textContent = b ? b.name.toUpperCase() : 'NO SIGNAL';
  }
  $('razor').className = 'razor' + (b && b.hot ? ' live' : '');
}
function esc(s) { const d = document.createElement('i'); d.textContent = s; return d.innerHTML; }

// ---------- interactions ----------
$('boxes').addEventListener('click', e => {
  const del = e.target.dataset.del;
  if (del !== undefined) { boxes.splice(+del, 1); mainIdx = -1; render(); return; }
  const box = e.target.closest('.box');
  if (box) goManual(+box.dataset.i);
});
function goManual(i) {
  mainIdx = i; manualUntil = Date.now() + 120000; render();
  setStatus(`manual: ${boxes[i].name} — autopilot resumes in 2 min`);
}
document.addEventListener('keydown', e => {
  const n = parseInt(e.key);
  if (n >= 1 && n <= boxes.length) goManual(n - 1);
});
$('addform').addEventListener('submit', e => {
  e.preventDefault();
  boxes.push({ name: $('f-name').value.trim(), url: $('f-url').value.trim(), team: $('f-team').value.trim().toUpperCase() });
  e.target.reset(); render();
  if (mainIdx === -1) { mainIdx = boxes.length - 1; render(); }
});
$('demo-btn').addEventListener('click', () => {
  boxes.push(
    { name: 'TEST: Sintel', url: 'https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8', team: 'PHI' },
    { name: 'TEST: Big Buck Bunny', url: 'https://test-streams.mux.dev/pts_shift/master.m3u8', team: 'KC' },
  );
  render();
  if (mainIdx === -1) { mainIdx = 0; render(); }
});
$('autopilot').addEventListener('click', () => {
  autopilot = !autopilot; manualUntil = 0;
  $('autopilot').className = autopilot ? 'on' : 'off';
  $('ap-text').textContent = autopilot ? 'AUTOPILOT' : 'AUTOPILOT OFF';
  if (!autopilot && mainIdx === -1 && boxes.length) { mainIdx = 0; render(); }
});

function setStatus(s) { $('status').textContent = s; }

// ---------- ESPN live scoreboard (free, no key) ----------
const ESPN = 'https://site.web.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard';

async function pollESPN() {
  try {
    const r = await fetch(ESPN, { cache: 'no-store' });
    const j = await r.json();
    espnGames = (j.events || []).map(ev => {
      const comp = ev.competitions[0];
      const sit = comp.situation || {};
      const home = comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors.find(c => c.homeAway === 'away');
      return {
        id: ev.id, status: ev.status.type.state, // 'in' = live
        detail: ev.status.type.shortDetail,
        home: home.team.abbreviation, away: away.team.abbreviation,
        hs: home.score, as: away.score,
        redzone: !!sit.isRedZone, down: sit.down, distance: sit.distance,
        poss: sit.possession, ballOn: sit.ballOn,
        last: (comp.details && comp.details.length) ? comp.details[comp.details.length-1].text : '',
      };
    });
    updateBrain();
    updateTicker();
  } catch (err) {
    setStatus('ESPN fetch failed — autopilot idling. ' + err.message);
  }
}

function excitement(g) {
  if (g.status !== 'in') return 0;
  let x = 10; // any live game
  const diff = Math.abs(+g.hs - +g.as);
  if (diff <= 8) x += 25;            // one-score game
  if (diff <= 3) x += 15;            // knife edge
  if (g.redzone) x += 60;            // RED ZONE
  if (g.down === 4) x += 20;         // 4th down drama
  if (g.down === 3 && g.distance <= 2) x += 10;
  return x;
}

function updateBrain() {
  // link boxes to games via team abbrev
  boxes.forEach(b => {
    b.hot = false; b.score = ''; b.sitLine = '';
    const g = espnGames.find(g => g.status === 'in' && (g.home === b.team || g.away === b.team));
    b.game = g || null;
    if (g) {
      b.score = `${g.away} ${g.as} – ${g.home} ${g.hs}`;
      if (g.redzone) {
        b.hot = true;
        b.sitLine = `RZ ${g.down}&${g.distance}`;
      }
    }
  });

  if (!autopilot) { render(); return; }
  if (Date.now() < manualUntil) { render(); return; }

  // candidate = tracked boxes with a live game, ranked by excitement
  const cands = boxes
    .map((b, i) => ({ i, b, x: b.game ? excitement(b.game) : 0 }))
    .sort((a, z) => z.x - a.x);

  if (!cands.length) { render(); return; }
  const top = cands[0];
  if (top.x >= 40) {  // threshold: only jump when something's actually cooking
    if (mainIdx !== top.i) {
      mainIdx = top.i;
      const g = top.b.game;
      setStatus(`⚡ AUTOPILOT → ${top.b.name} ${g ? `(${g.away} ${g.as}–${g.hs} ${g.home}${g.redzone ? ' · RED ZONE' : ''})` : ''}`);
    } else {
      const g = top.b.game;
      setStatus(`watching ${top.b.name}${g ? ` — ${g.detail} · ${g.redzone ? 'RED ZONE ' : ''}${g.down && g.down <= 4 && g.status === 'in' ? g.down + '&' + g.distance + ' ' : ''}` : ''}`);
    }
  } else if (mainIdx === -1 && boxes.length) {
    mainIdx = 0;
    setStatus('no live drama detected — idling on box 1');
  } else {
    setStatus('no red-zone drama right now — holding');
  }
  render();
  $('razor').className = 'razor' + (boxes[mainIdx] && boxes[mainIdx].hot ? ' live' : '');
}

function updateTicker() {
  const items = espnGames.slice(0, 14).map(g => {
    const rz = g.redzone ? ' <span class="rz">● RZ</span>' : '';
    return `<span><b>${g.away} ${g.as}</b> at <b>${g.home} ${g.hs}</b> · ${g.detail}${rz}</span>`;
  });
  $('ticker-items').innerHTML = items.join('') || '<span>no games today</span>';
}

// ---------- source packs (M3U playlists) ----------
let packChannels = [];

$('pack-btn').addEventListener('click', () => { $('pack-modal').classList.add('open'); });
$('pack-close').addEventListener('click', () => $('pack-modal').classList.remove('open'));
$('pack-modal').addEventListener('click', e => { if (e.target.id === 'pack-modal') $('pack-modal').classList.remove('open'); });

function parseM3U(text) {
  const chans = [];
  const re = /#EXTINF:[^\n]*?,\s*([^\n]+)\s*\n([^\s#][^\n]*)/g;
  let m;
  while ((m = re.exec(text)) !== null) {
    const name = m[1].trim(), url = m[2].trim();
    if (/^https?:\/\//.test(url)) chans.push({ name: name.replace(/\s*\[.*?\]\s*/g, '').trim() || url, url });
  }
  return chans;
}

async function loadPack() {
  const url = $('pack-url').value.trim();
  $('pack-list').innerHTML = '<div style="padding:14px;color:var(--dim);font-size:12px">loading…</div>';
  try {
    const r = await fetch(url, { cache: 'no-store' });
    const t = await r.text();
    packChannels = parseM3U(t);
    renderPackList();
  } catch (e) {
    $('pack-list').innerHTML = `<div style="packlist-err" style="color:var(--red);padding:14px;font-size:12px">failed: ${esc(e.message)} — try a CORS proxy like https://corsproxy.io/?url=</div>`;
  }
}
$('pack-load').addEventListener('click', loadPack);
$('pack-url').addEventListener('keydown', e => { if (e.key === 'Enter') loadPack(); });

function renderPackList() {
  const q = $('pack-search').value.trim().toLowerCase();
  const list = packChannels.filter(c => !q || c.name.toLowerCase().includes(q)).slice(0, 300);
  const el = $('pack-list');
  if (!list.length) { el.innerHTML = '<div style="padding:14px;color:var(--dim);font-size:12px">no matches</div>'; return; }
  el.innerHTML = '';
  list.forEach((c, idx) => {
    const actual = packChannels.indexOf(c);
    const div = document.createElement('div');
    div.className = 'chan' + (boxes.some(b => b.url === c.url) ? ' added' : '');
    div.innerHTML = `<span>${esc(c.name)}</span><span class="u">${esc(c.url.slice(0, 60))}</span>`;
    div.onclick = () => {
      boxes.push({ name: c.name, url: c.url, team: '' });
      render();
      div.classList.add('added');
      setStatus(`added box: ${c.name}`);
    };
    el.appendChild(div);
  });
}
$('pack-search').addEventListener('input', renderPackList);

// ---------- boot ----------
render();
pollESPN();
pollTimer = setInterval(pollESPN, 15000);
setStatus('ready — add boxes or load demo streams');
</script>
</body>
</html>
